name: Publish to NPM

on:
  push:
    branches: [master] # Triggers immediately when code or a PR lands on master

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Allows creating git tags/releases
      id-token: write       # Crucial for NPM OIDC Provenance verification
      pull-requests: write  # Allows commenting on merged PRs
      issues: write         # Allows commenting on related issues

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false # Avoids permission token loops

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'      # Uses stable Node environment
          registry-url: 'https://npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build           # Compiles your TypeScript files

      - name: Automated Release and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # Feeds your NPM secret to semantic-release
        run: npx semantic-release
