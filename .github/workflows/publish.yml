name: Publish to NPM

on:
  push:
    branches: [master]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Allows creating git tags/releases
      id-token: write       # Crucial for NPM OIDC Provenance verification
      pull-requests: write  # Allows commenting on merged PRs
      issues: write         # Allows commenting on related issues

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'      
          registry-url: 'https://npmjs.org'

      - name: Install Dependencies
        # FIX: Inject the auth token here so the dependency fetch doesn't hit a 403 wall
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm ci

      - name: Run Build
        run: npm run build           

      - name: Automated Release and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} 
        run: npx semantic-release
