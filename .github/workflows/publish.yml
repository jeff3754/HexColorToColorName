name: Publish to NPM

on:
  push:
    branches: [master]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Allows semantic-release to create git tags/releases
      id-token: write       # Required for NPM OIDC Provenance verification
      pull-requests: write  # Allows commenting on merged PRs
      issues: write         # Allows commenting on related issues

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'      

      - name: Install Dependencies
        run: npm ci                  

      - name: Run Build
        run: npm run build           

      - name: Automated Release and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} 
          # FIX: Instruct npm to entirely skip running your local postversion script inside the runner environment
          npm_config_ignore_scripts: "true"
        run: npx semantic-release
